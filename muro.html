<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muro · Los 21 de Gonza</title>
<meta name="theme-color" content="#0A1E4A">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icono.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Muro de mensajes · Los 21 de Gonza">
<meta property="og:description" content="Todos los mensajes para Gonza en un solo lugar.">
<meta property="og:image" content="https://los21degonza.github.io/vista-previa.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800;900&display=swap">
<style>
:root {
  --bg: #0A1E4A;
  --ink: #FFFFFF;
  --muted: #A9BCE0;
  --turq: #5CF2E6;
  --yellow: #FFD23F;
  --navy: #0A1E4A;
  --card: rgba(7, 21, 55, 0.62);
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0A1E4A; --ink: #FFFFFF; --muted: #A9BCE0; }
}
:root[data-theme="dark"] { --bg: #0A1E4A; --ink: #FFFFFF; --muted: #A9BCE0; }
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; color: var(--ink); font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; }
.fondo { position: fixed; inset: 0; z-index: 0; background: var(--bg) url('fondo-agua.jpg') center / cover no-repeat; }
.fondo::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 85% 60% at 50% 30%, rgba(4, 18, 48, 0.2) 0%, rgba(4, 18, 48, 0.55) 60%, rgba(4, 18, 48, 0.85) 100%); }
main { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 48px 18px 48px; }
header { text-align: center; }
.los { font-weight: 800; font-size: 15px; letter-spacing: 10px; padding-left: 10px; }
.veintiuno {
  font-weight: 900; font-size: clamp(110px, 20vw, 220px); line-height: 0.82; letter-spacing: -0.03em; margin-top: 6px;
  text-shadow: 0 2px 0 rgba(92, 242, 230, 0.95), 0 9px 0 rgba(92, 242, 230, 0.5), 0 16px 0 rgba(92, 242, 230, 0.26), 0 0 34px rgba(92, 242, 230, 0.35);
}
.de { font-weight: 800; font-size: 15px; letter-spacing: 10px; padding-left: 10px; margin-top: 26px; }
.gonza { font-weight: 900; font-size: clamp(58px, 11vw, 120px); line-height: 0.95; letter-spacing: -0.01em; text-shadow: 0 0 26px rgba(92, 242, 230, 0.45), 0 6px 18px rgba(0, 22, 58, 0.5); }
.cuentas { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 26px 0 30px; }
.cuenta { display: flex; align-items: baseline; gap: 10px; padding: 12px 22px; border-radius: 999px; background: var(--card); border: 2px solid rgba(92, 242, 230, 0.45); }
.cuenta b { font-size: 34px; font-weight: 900; line-height: 1; }
.cuenta span { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--muted); }
.cuenta.si { background: var(--yellow); border-color: var(--yellow); color: var(--navy); }
.cuenta.si span { color: rgba(10, 30, 74, 0.75); }
.muro { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 340px)); justify-content: center; align-items: start; gap: 16px; }
.msj {
  margin: 0;
  padding: 16px 18px 18px; border-radius: 20px 20px 20px 6px;
  background: var(--card); border: 2px solid rgba(92, 242, 230, 0.4);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
}
.msj.rapido { border-color: rgba(255, 210, 63, 0.75); }
.msj.nuevo { animation: entra 0.6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes entra { from { opacity: 0; transform: translateY(18px) scale(0.92); } to { opacity: 1; transform: none; } }
.quien { font-size: 13px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--turq); }
.texto { font-size: 21px; font-weight: 800; line-height: 1.3; margin-top: 6px; overflow-wrap: anywhere; }
.hora { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 8px; }
.vacio { text-align: center; font-size: 19px; font-weight: 700; color: var(--muted); padding: 30px 10px; }
.pie { display: flex; justify-content: center; margin-top: 18px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 24px;
  border-radius: 16px; background: var(--yellow); color: var(--navy); text-decoration: none; font-weight: 900; font-size: 17px;
}
.btn:focus-visible { outline: 3px solid var(--turq); outline-offset: 3px; }
.estado { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 14px; min-height: 18px; }
@media (prefers-reduced-motion: reduce) { .msj.nuevo { animation: none; } }
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<main>
  <header>
    <div class="los">LOS</div>
    <div class="veintiuno" aria-hidden="true">21</div>
    <div class="de">DE</div>
    <h1 class="gonza" style="margin:0">GONZA</h1>
  </header>
  <div class="cuentas" aria-live="polite">
        <div class="cuenta"><b id="nMsj">0</b><span id="lMsj">MENSAJES</span></div>
  </div>
  <section class="muro" id="muro" aria-label="Mensajes para Gonza"></section>
  <div class="vacio" id="vacio" hidden>Todavía no hay mensajes. ¡Dejá el primero!</div>
  <div class="pie"><a class="btn" href="./">Dejá un mensaje en el muro</a></div>
  <div class="estado" id="estado" role="status"></div>
</main>
<script>
(function () {
  var MURO_URL = 'https://script.google.com/macros/s/AKfycbzLJYlFTI7WtS888bjICQrDMt1gSEDyXiqMtm3LqTMzt8SAUUKey0cgsm9wppudFgax/exec';
  var muro = document.getElementById('muro');
  var vacio = document.getElementById('vacio');
  var estado = document.getElementById('estado');
  var vistos = {}, primera = true, n = 0;
  function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function hhmm(iso) { try { var d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleDateString('es-UY', { day: 'numeric', month: 'short' }) + ' · ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); } catch (e) { return ''; } }
  function pintar(lista) {
    lista = (lista || []).slice().sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });
    document.getElementById('nMsj').textContent = lista.length;
    document.getElementById('lMsj').textContent = lista.length === 1 ? 'MENSAJE' : 'MENSAJES';
    vacio.hidden = lista.length > 0;
    muro.textContent = '';
    lista.forEach(function (m) {
      var k = m.fecha + '|' + m.nombre + '|' + m.mensaje;
      var el = document.createElement('article');
      el.className = 'msj' + (m.opcion && m.opcion !== 'Mi mensaje' ? ' rapido' : '') + (!primera && !vistos[k] ? ' nuevo' : '');
      var q = document.createElement('div'); q.className = 'quien'; q.textContent = m.nombre;
      var t = document.createElement('div'); t.className = 'texto'; t.textContent = m.mensaje;
      var h = document.createElement('div'); h.className = 'hora'; h.textContent = hhmm(m.fecha);
      el.appendChild(q); el.appendChild(t); if (h.textContent) el.appendChild(h);
      muro.appendChild(el);
      vistos[k] = 1;
    });
    primera = false;
  }
  function cargar() {
    if (!/^https:\/\/script\.google\.com\//.test(MURO_URL)) { vacio.hidden = false; estado.textContent = 'El muro todavía no está conectado.'; return; }
    var cb = 'muroCb' + (++n);
    var sc = document.createElement('script');
    var listo = false;
    window[cb] = function (d) {
      listo = true;
      try { pintar(d && d.mensajes); var a = new Date(); estado.textContent = 'Actualizado ' + ('0' + a.getHours()).slice(-2) + ':' + ('0' + a.getMinutes()).slice(-2); } catch (e) {}
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      sc.remove();
    };
    sc.onerror = function () { if (!listo) estado.textContent = 'No se pudo actualizar. Reintentando…'; sc.remove(); };
    sc.src = MURO_URL + '?callback=' + cb + '&t=' + Date.now();
    document.body.appendChild(sc);
  }
  cargar();
  setInterval(function () { if (!document.hidden) cargar(); }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) cargar(); });
})();
</script>
</body>
</html>
