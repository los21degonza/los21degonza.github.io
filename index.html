<style>
:root {
  --bg: #0A1E4A;
  --ink: #FFFFFF;
  --yellow: #FFD23F;
  --navy: #0A1E4A;
  --turq: #5CF2E6;
  --card: #071537;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0A1E4A; --ink: #FFFFFF; --card: #071537; }
}
:root[data-theme="dark"] { --bg: #0A1E4A; --ink: #FFFFFF; --card: #071537; }
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
.fondo {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: var(--bg) url('fondo-agua.jpg') center / cover no-repeat;
}
.fondo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(4, 18, 48, 0.15) 0%, rgba(4, 18, 48, 0.45) 60%, rgba(4, 18, 48, 0.8) 100%);
}
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
  display: flex;
  justify-content: center;
}
main {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 460px;
  padding: 16px 16px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.video-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 18px;
  overflow: hidden;
  background: var(--card);
  border: 2px solid rgba(92, 242, 230, 0.55);
  box-shadow: 0 0 28px rgba(92, 242, 230, 0.28), 0 18px 50px rgba(0, 0, 0, 0.4);
}
video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  padding: 0;
  background: rgba(7, 21, 55, 0.35);
  cursor: pointer;
}
.play[hidden] { display: none; }
.play span {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 56px;
  padding: 0 26px;
  border-radius: 999px;
  background: var(--yellow);
  color: var(--navy);
  font-family: inherit;
  font-weight: 900;
  font-size: 18px;
  letter-spacing: 0.5px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
.botones { display: flex; flex-direction: column; gap: 12px; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 58px;
  padding: 0 20px;
  border-radius: 16px;
  text-decoration: none;
  font-weight: 900;
  font-size: 18px;
  letter-spacing: 0.3px;
}
.btn svg { flex: none; }
.btn-mapa { background: var(--ink); color: var(--navy); }
.btn-ok { background: var(--yellow); color: var(--navy); }
button.btn { width: 100%; border: 0; cursor: pointer; font-family: inherit; }
.btn-ok[aria-expanded="true"] { box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.35); }
.opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opciones[hidden] { display: none; }
.chip {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 54px;
  padding: 0 12px;
  border-radius: 14px;
  text-decoration: none;
  text-align: center;
  font-weight: 900;
  font-size: 18px;
  color: var(--ink);
  background: rgba(7, 21, 55, 0.6);
  border: 2px solid var(--yellow);
}
.chip:focus-visible { outline: 3px solid var(--turq); outline-offset: 3px; }
button.chip { font-family: inherit; cursor: pointer; }
.chip-full { grid-column: 1 / -1; }
.chip[aria-expanded="true"] { background: rgba(255, 210, 63, 0.16); }
.mi-panel { display: flex; flex-direction: column; gap: 10px; }
.mi-panel[hidden] { display: none; }
.mi-panel textarea {
  width: 100%;
  min-height: 96px;
  padding: 12px 14px;
  border-radius: 14px;
  border: 2px solid rgba(92, 242, 230, 0.45);
  background: rgba(7, 21, 55, 0.6);
  color: var(--ink);
  font-family: inherit;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
  resize: vertical;
}
.mi-panel textarea::placeholder { color: rgba(255, 255, 255, 0.5); }
.mi-panel textarea:focus-visible { outline: 3px solid var(--turq); outline-offset: 2px; }
.respuesta[hidden] { display: none; }
.respuesta { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.env { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 88%; animation: pop 0.35s ease-out both; }
.b-env {
  padding: 11px 14px 8px 16px;
  border-radius: 18px 18px 6px 18px;
  background: var(--yellow);
  color: var(--navy);
  font-weight: 800;
  font-size: 17px;
  line-height: 1.3;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
}
.b-env .meta { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; font-weight: 700; color: rgba(10, 30, 74, 0.65); }
.ticks { display: block; }
.ticks path { fill: none; stroke: rgba(10, 30, 74, 0.55); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset 0.28s ease-out, stroke 0.35s ease; }
.ticks .t1 { stroke-dashoffset: 0; }
.ticks.doble .t2 { stroke-dashoffset: 0; }
.ticks.leido path { stroke: #0A6E8C; }
.env-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; color: var(--turq); opacity: 0; transform: translateY(-4px); transition: opacity 0.3s ease, transform 0.3s ease; }
.env-label.on { opacity: 1; transform: none; }
.typing[hidden] { display: none; }
.typing { align-self: flex-start; display: flex; align-items: center; gap: 5px; padding: 12px 16px; border-radius: 18px 18px 18px 6px; background: rgba(7, 21, 55, 0.78); border: 2px solid rgba(92, 242, 230, 0.4); animation: pop 0.25s ease-out both; }
.typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--turq); animation: dot 1s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
.burbuja[hidden] { display: none; }
.btn-wa[hidden] { display: none; }
.btn-wa { margin-top: 6px; animation: pop 0.35s ease-out both, pulso 1.6s ease-in-out 0.4s 3; }
.btn-wa.hecho { animation: none; background: transparent; color: var(--yellow); border: 2px solid var(--yellow); min-height: 50px; font-size: 16px; }
.btn-wa.hecho svg path:first-child { fill: var(--yellow); }
@keyframes pulso { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 63, 0.55); } 50% { box-shadow: 0 0 0 10px rgba(255, 210, 63, 0); } }
.burbuja { align-self: flex-start; animation: pop 0.35s ease-out both; }
.burbuja {
  max-width: 92%;
  padding: 14px 18px 15px;
  border-radius: 18px 18px 18px 6px;
  background: rgba(7, 21, 55, 0.78);
  border: 2px solid rgba(92, 242, 230, 0.6);
  box-shadow: 0 0 22px rgba(92, 242, 230, 0.25);
  color: var(--ink);
  line-height: 1.3;
}
.burbuja .r1 { font-weight: 800; font-size: 18px; }
.burbuja .r2 { font-weight: 900; font-size: 22px; margin-top: 6px; letter-spacing: 0.3px; }
.burbuja .r3 { font-weight: 800; font-size: 18px; margin-top: 6px; color: var(--yellow); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .env, .burbuja, .typing { animation: none; } .typing span { animation: none; opacity: 0.8; } }
.btn:focus-visible, .play:focus-visible { outline: 3px solid var(--turq); outline-offset: 3px; }
.muro-form { display: flex; flex-direction: column; gap: 10px; }
.muro-form[hidden] { display: none; }
.campo {
  width: 100%; min-height: 54px; padding: 12px 16px;
  border-radius: 14px; border: 2px solid rgba(92, 242, 230, 0.45);
  background: rgba(7, 21, 55, 0.65); color: var(--ink);
  font-family: inherit; font-size: 18px; font-weight: 700;
}
textarea.campo { min-height: 96px; resize: vertical; line-height: 1.35; font-weight: 600; }
.campo::placeholder { color: rgba(255, 255, 255, 0.5); }
.campo:focus-visible { outline: 3px solid var(--turq); outline-offset: 2px; }
.campo[hidden] { display: none; }
.chip[aria-pressed="true"] { background: var(--yellow); color: var(--navy); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
#enviar:disabled { opacity: 0.45; cursor: default; }
.aviso { min-height: 0; text-align: center; font-weight: 700; font-size: 15px; color: #FF9A8A; }
.aviso:empty { display: none; }
.b-env .quien { display: block; font-size: 12px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: rgba(10, 30, 74, 0.6); margin-bottom: 2px; }
.btn-muro[hidden] { display: none; }
.btn-muro { margin-top: 6px; animation: pop 0.35s ease-out both; }
#papelitos { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<main>
  <div class="video-wrap">
    <video id="video" playsinline preload="auto" poster="portada.jpg" src="video.mp4"></video>
    <button class="play" id="play" type="button" aria-label="Ver la invitación con sonido">
      <span>
        <svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true"><path d="M1 1 L15 9 L1 17 Z" fill="#0A1E4A"/></svg>
        Ver invitación
      </span>
    </button>
  </div>
  <nav class="botones" aria-label="Acciones">
    <a class="btn btn-mapa" href="https://maps.app.goo.gl/4c6CTYL5Uv7o72Pz7" target="_blank" rel="noopener">
      <svg width="20" height="24" viewBox="0 0 20 24" aria-hidden="true"><path d="M10 1C5.03 1 1 4.95 1 9.8 1 16.4 10 23 10 23s9-6.6 9-13.2C19 4.95 14.97 1 10 1Zm0 12.3a3.4 3.4 0 1 1 0-6.8 3.4 3.4 0 0 1 0 6.8Z" fill="#0A1E4A"/></svg>
      Cómo llegar
    </a>
    <button class="btn btn-ok" id="msgBtn" type="button" aria-expanded="false" aria-controls="opciones">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2C5.75 2 1.6 5.7 1.6 10.3c0 2.5 1.25 4.75 3.25 6.25L4 20.2l4.15-2.05c.9.22 1.85.35 2.85.35 5.25 0 9.4-3.7 9.4-8.2S16.25 2 11 2Z" fill="#0A1E4A"/><circle cx="7" cy="10.3" r="1.35" fill="#FFD23F"/><circle cx="11" cy="10.3" r="1.35" fill="#FFD23F"/><circle cx="15" cy="10.3" r="1.35" fill="#FFD23F"/></svg>
      ¡Mandale un mensaje a Gonza!
    </button>
    <div class="muro-form" id="opciones" hidden>
      <input class="campo" id="nombre" type="text" maxlength="40" placeholder="Tu nombre" autocomplete="given-name" aria-label="Tu nombre">
      <div class="opciones">
        <button class="chip" type="button" data-op="Estoy" data-msg="Estoy para el cumple de Gonza !!!" aria-pressed="false">¡Estoy!</button>
        <button class="chip" type="button" data-op="Voy" data-msg="Voy al cumple de Gonza !!!" aria-pressed="false">¡Voy!</button>
        <button class="chip" type="button" data-op="Me prendo" data-msg="Me prendo al cumple de Gonza !!!" aria-pressed="false">Me prendo</button>
        <button class="chip" type="button" data-op="Contá conmigo" data-msg="Contá conmigo para el cumple de Gonza !!!" aria-pressed="false">Contá conmigo</button>
        <button class="chip chip-full" type="button" data-op="Mi mensaje" data-msg="" aria-pressed="false">Mi mensaje</button>
      </div>
      <textarea class="campo" id="miTexto" maxlength="400" placeholder="Escribile algo a Gonza…" aria-label="Tu mensaje para Gonza" hidden></textarea>
      <input class="hp" id="web" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-ok" id="enviar" type="button" disabled>Enviar a Gonza</button>
      <div class="aviso" id="aviso" role="status"></div>
    </div>
    <div class="respuesta" id="respuesta" role="status" hidden>
      <div class="env">
        <div class="b-env"><span class="quien" id="envQuien"></span><span id="envTexto"></span><span class="meta"><span id="envHora"></span><svg class="ticks" id="ticks" width="20" height="12" viewBox="0 0 20 12" aria-hidden="true"><path class="t1" d="M1.5 6.5 4.8 9.8 11.5 2.5"/><path class="t2" d="M7.2 9.4 7.6 9.8 14.3 2.5"/></svg></span></div>
        <div class="env-label" id="envLabel"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.2" fill="none" stroke="#5CF2E6" stroke-width="1.6"/><path d="M4.2 7.2 6.2 9.1 9.9 5" fill="none" stroke="#5CF2E6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Enviado a Gonza</div>
      </div>
      <div class="typing" id="typing" aria-label="Gonza está escribiendo" hidden><span></span><span></span><span></span></div>
      <div class="burbuja" id="reply" hidden>
        <div class="r1">¡Genial! Te esperooo 🏉</div>
        <div class="r2">Los 21 de Gonza</div>
        <div class="r3">¡Show en vivo!</div>
      </div>
      <a class="btn btn-mapa btn-muro" id="verMuro" href="muro.html" hidden>
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="3" width="8" height="7" rx="2" fill="#0A1E4A"/><rect x="12" y="3" width="8" height="10" rx="2" fill="#0A1E4A"/><rect x="2" y="12" width="8" height="7" rx="2" fill="#0A1E4A"/><rect x="12" y="15" width="8" height="4" rx="2" fill="#0A1E4A"/></svg>
        Ver el muro de Gonza
      </a>
    </div>
  </nav>
</main>
<script>
(function () {
  var v = document.getElementById('video');
  var b = document.getElementById('play');
  function start() {
    try { v.currentTime = 0; } catch (e) {}
    v.muted = false;
    var p = v.play();
    if (p && p.catch) { p.catch(function () { b.hidden = false; }); }
    b.hidden = true;
  }
  b.addEventListener('click', start);
  v.addEventListener('click', function () {
    if (v.paused) { v.play(); } else { v.pause(); }
  });
  v.addEventListener('ended', function () { b.hidden = false; });
  var mb = document.getElementById('msgBtn');
  var op = document.getElementById('opciones');
  mb.addEventListener('click', function () {
    var abrir = op.hidden;
    op.hidden = !abrir;
    mb.setAttribute('aria-expanded', abrir ? 'true' : 'false');
  });
  var MURO_URL = 'https://script.google.com/macros/s/AKfycbzLJYlFTI7WtS888bjICQrDMt1gSEDyXiqMtm3LqTMzt8SAUUKey0cgsm9wppudFgax/exec';
  var form = op;
  var nombre = document.getElementById('nombre');
  var miTexto = document.getElementById('miTexto');
  var enviar = document.getElementById('enviar');
  var aviso = document.getElementById('aviso');
  var web = document.getElementById('web');
  var resp = document.getElementById('respuesta');
  var envQuien = document.getElementById('envQuien');
  var envTexto = document.getElementById('envTexto');
  var envHora = document.getElementById('envHora');
  var ticks = document.getElementById('ticks');
  var envLabel = document.getElementById('envLabel');
  var typing = document.getElementById('typing');
  var reply = document.getElementById('reply');
  var verMuro = document.getElementById('verMuro');
  var chips = Array.prototype.slice.call(document.querySelectorAll('.muro-form .chip'));
  var sel = null, timers = [];
  function hora() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function datos() {
    var n = nombre.value.replace(/\s+/g, ' ').trim();
    var m = sel ? (sel.op === 'Mi mensaje' ? miTexto.value.trim() : sel.msg) : '';
    enviar.disabled = !(n && m);
    return { n: n, m: m };
  }
  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      chips.forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      c.setAttribute('aria-pressed', 'true');
      sel = { op: c.getAttribute('data-op'), msg: c.getAttribute('data-msg') };
      miTexto.hidden = sel.op !== 'Mi mensaje';
      if (!miTexto.hidden) { try { miTexto.focus(); } catch (e) {} }
      else if (!nombre.value.trim()) { try { nombre.focus(); } catch (e) {} }
      aviso.textContent = '';
      datos();
    });
  });
  nombre.addEventListener('input', datos);
  miTexto.addEventListener('input', datos);
  function papelitos() {
    try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
    var cv = document.createElement('canvas'); cv.id = 'papelitos'; document.body.appendChild(cv);
    var ctx = cv.getContext('2d'); var W = cv.width = window.innerWidth; var H = cv.height = window.innerHeight;
    var cols = ['#5CF2E6', '#FFD23F', '#FFFFFF', '#1F3BFF'], P = [];
    for (var i = 0; i < 150; i++) P.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.35, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 14 - 4, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 7, h: 9 + Math.random() * 9, c: cols[i % 4] });
    var t0 = performance.now();
    (function frame(t) {
      var k = (t - t0) / 1000; ctx.clearRect(0, 0, W, H);
      P.forEach(function (p) { p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - 2) / 0.8); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
      if (k < 2.8) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }
  function mostrarChat(d, animar) {
    timers.forEach(clearTimeout); timers = [];
    envQuien.textContent = d.n; envTexto.textContent = d.m; envHora.textContent = d.h || '';
    resp.hidden = false;
    if (!animar) { ticks.classList.add('doble', 'leido'); envLabel.classList.add('on'); typing.hidden = true; reply.hidden = false; verMuro.hidden = false; return; }
    ticks.classList.remove('doble', 'leido'); envLabel.classList.remove('on'); typing.hidden = true; reply.hidden = true; verMuro.hidden = true;
    try { resp.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    timers.push(setTimeout(function () { ticks.classList.add('doble'); }, 400));
    timers.push(setTimeout(function () { ticks.classList.add('leido'); envLabel.classList.add('on'); }, 850));
    timers.push(setTimeout(function () { typing.hidden = false; }, 1200));
    timers.push(setTimeout(function () { typing.hidden = true; reply.hidden = false; papelitos(); }, 2500));
    timers.push(setTimeout(function () { verMuro.hidden = false; }, 3100));
  }
  enviar.addEventListener('click', function () {
    var d = datos();
    if (enviar.disabled) return;
    if (!/^https:\/\/script\.google\.com\//.test(MURO_URL)) { aviso.textContent = 'El muro todavía no está conectado.'; return; }
    enviar.disabled = true; enviar.textContent = 'Enviando…'; aviso.textContent = '';
    fetch(MURO_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ nombre: d.n, mensaje: d.m, opcion: sel.op, web: web.value }) })
      .then(function () {
        d.h = hora();
        try { localStorage.setItem('gonza21-muro', JSON.stringify(d)); } catch (e) {}
        form.hidden = true; mb.setAttribute('aria-expanded', 'false');
        miTexto.value = ''; enviar.textContent = 'Enviar a Gonza';
        chips.forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); sel = null; miTexto.hidden = true; datos();
        mostrarChat(d, true);
      })
      .catch(function () {
        enviar.disabled = false; enviar.textContent = 'Enviar a Gonza';
